# NOX backend vhost — put cert.pem/key.pem in infra/nginx/certs
# (Let's Encrypt: certbot certonly --standalone -d api.nox.client)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location /license/ {
        proxy_pass http://license:8787/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /friends/ {
        proxy_pass http://friend-sync:8788/;
    }
    location /chat/ws {
        proxy_pass http://chat-relay:8789/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /analytics/ {
        proxy_pass http://analytics:8790/;
    }
    location = /health {
        return 200 '{"ok":true}';
        add_header Content-Type application/json;
    }
}
