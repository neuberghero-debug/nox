plugins {
    id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.31'
    id 'java'
}

version = '0.2.0-beta'
group = 'dev.noxclient'

base { archivesName = 'nox' }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Premium split — premium sources compile into main output so they ride the
// normal loom remap pass, then stripPremium carves them out of the finished
// jar into the AES-256-GCM pack (assets/noxclient/premium.nxp). The shipped
// free jar physically lacks the premium bytecode — a signed license is the
// only decryption key. (Invariant: src/main must never import premium classes
// — they're absent at runtime; shared state goes through util buses.)
sourceSets {
    main.java.srcDir 'src/premium/java'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.2+26.3'
    implementation 'com.google.code.gson:gson:2.11.0'
    // NanoVG (LWJGL module) — vector overlay pass for GUI glow/gradients
    implementation 'org.lwjgl:lwjgl-nanovg:3.4.3'
    include('org.lwjgl:lwjgl-nanovg:3.4.3') { transitive = false }
    // Netty proxy handlers — alt-manager SOCKS5/SOCKS4/HTTP connect proxy
    implementation "io.netty:netty-handler-proxy:4.2.16.Final"
    include "io.netty:netty-handler-proxy:4.2.16.Final"
    ['natives-linux', 'natives-linux-arm64', 'natives-windows', 'natives-windows-arm64', 'natives-macos', 'natives-macos-arm64'].each { c ->
        runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.3:${c}"
        include "org.lwjgl:lwjgl-nanovg:3.4.3:${c}@jar"
    }
}

loom {
    runs {
        client {
            client()
            runDir 'run'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

// ---- premium pack: carve premium classes out of the remapped jar ----
// jar → stripPremium → noxJarSig (sig hashes the STRIPPED free jar).
// The pack key is derived exactly like PremiumVault does at runtime:
// AES key = SHA-256("NOX-PREM-1" || base64url-decode(k)); file = nonce||ct.
def stripPremium = tasks.register('stripPremium') {
    def jarFile = layout.buildDirectory.file("libs/nox-${project.version}.jar")
    inputs.file(jarFile)
    dependsOn 'jar'
    doLast {
        def jarPath = jarFile.get().asFile
        // premium class-path prefixes from the source tree (can't drift)
        // premium sources are private (gitignored) — a public clone has none
        // and builds a FREE-only client (no pack embedded)
        def premRoots = fileTree('src/premium/java').matching { include '**/*.java' }
            .files.collect { f ->
                def rel = file('src/premium/java').toPath().relativize(f.toPath()).toString()
                rel.replace(File.separatorChar, '/' as char) - '.java'
            }
        if (premRoots.isEmpty()) {
            println 'premium split -> no src/premium sources — building FREE client'
            return
        }
        def isPrem = { String n ->
            premRoots.any { r -> n == r + '.class' || n.startsWith(r + '$') }
        }
        def premEntries = [:], keepEntries = []
        new java.util.zip.ZipFile(jarPath).withCloseable { z ->
            z.stream().each { e ->
                if (!e.directory && isPrem(e.name))
                    premEntries[e.name] = z.getInputStream(e).bytes
                else
                    keepEntries.add(e)
            }
        }
        if (premEntries.isEmpty()) throw new GradleException('stripPremium: no premium classes found in jar')
        // pack jar (plain zip of premium classes) → AES-256-GCM
        // NOX_PACK_KEY env → gitignored nox-bot/keys/pack.key → dev fallback.
        // The bot embeds the same value as "k" in signed license payloads.
        def keyFile = file('nox-bot/keys/pack.key')
        def k64 = providers.environmentVariable('NOX_PACK_KEY')
            .orElse(providers.gradleProperty('noxPackKey'))
            .orElse(providers.provider { keyFile.exists() ? keyFile.text.trim() : 'nox-dev-pack-key-unset' })
        byte[] kb
        try { kb = Base64.urlDecoder.decode(k64.get()) }
        catch (Exception e) { kb = k64.get().getBytes('UTF-8') }
        def md = java.security.MessageDigest.getInstance('SHA-256')
        md.update('NOX-PREM-1'.getBytes('UTF-8')); md.update(kb)
        def key = new javax.crypto.spec.SecretKeySpec(md.digest(), 'AES')
        byte[] nonce = new byte[12]; new java.security.SecureRandom().nextBytes(nonce)
        def c = javax.crypto.Cipher.getInstance('AES/GCM/NoPadding')
        c.init(javax.crypto.Cipher.ENCRYPT_MODE, key, new javax.crypto.spec.GCMParameterSpec(128, nonce))
        def baos = new ByteArrayOutputStream()
        new java.util.zip.ZipOutputStream(baos).withCloseable { pz ->
            premEntries.each { n, b -> pz.putNextEntry(new java.util.zip.ZipEntry(n)); pz.write(b); pz.closeEntry() }
        }
        byte[] ct = c.doFinal(baos.toByteArray())
        // rewrite the free jar: drop premium classes, embed the sealed pack
        def tmp = new File(jarPath.parentFile, jarPath.name + '.premtmp')
        new java.util.zip.ZipFile(jarPath).withCloseable { z ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zos ->
                keepEntries.each { e ->
                    zos.putNextEntry(new java.util.zip.ZipEntry(e))
                    if (!e.directory) zos.write(z.getInputStream(e).bytes)
                    zos.closeEntry()
                }
                zos.putNextEntry(new java.util.zip.ZipEntry('assets/noxclient/premium.nxp'))
                zos.write(nonce); zos.write(ct); zos.closeEntry()
            }
        }
        if (!tmp.renameTo(jarPath)) throw new GradleException('stripPremium rewrite failed')
        println "premium split -> ${premEntries.size()} classes sealed into premium.nxp (${ct.length}B)"
    }
}

tasks.register('physicsCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noxclient.physics.PhysicsTest'
}
tasks.register('mediaCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noxclient.media.MediaTest'
}
tasks.register('breadcrumbsCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noxclient.module.render.BreadcrumbsTest'
}
tasks.register('baseSurveyCheck', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.noxclient.module.donutsmp.BaseSurveyTest'
}
tasks.named('check') { dependsOn 'physicsCheck', 'mediaCheck', 'breadcrumbsCheck', 'baseSurveyCheck' }

// TamperGuard signature: SHA-256 over class + metadata entries (name bytes
// then file bytes, sorted) — mirrors TamperGuard.selfHash() exactly.
// Computed on the FINAL jar (loom 'include' remaps fabric.mod.json), then
// sig.txt is appended into the jar — sig.txt itself is never hashed.
def noxJarSig = tasks.register('noxJarSig') {
    def jarFile = layout.buildDirectory.file("libs/nox-${project.version}.jar")
    inputs.file(jarFile)
    dependsOn 'stripPremium'   // sign the STRIPPED jar (premium classes absent)
    doLast {
        def jarPath = jarFile.get().asFile
        def tmp = new File(jarPath.parentFile, jarPath.name + '.sigtmp')
        def md = java.security.MessageDigest.getInstance('SHA-256')
        // zip archives can't be appended to — rewrite: hash entries, copy all,
        // add sig.txt, then atomically replace the jar
        def sig
        new java.util.zip.ZipFile(jarPath).withCloseable { z ->
            def hashed = z.stream().filter { e ->
                (e.name.startsWith('dev/noxclient/') && e.name.endsWith('.class')) ||
                    e.name == 'fabric.mod.json' || e.name == 'noxclient.mixins.json'
            }.collect()
            hashed.sort { a, b -> a.name <=> b.name }
            hashed.each { e ->
                md.update(e.name.getBytes('UTF-8'))
                md.update(z.getInputStream(e).bytes)
            }
            sig = md.digest().encodeHex().toString()
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp)).withCloseable { zos ->
                z.stream().each { e ->
                    if (e.name == 'assets/noxclient/sig.txt') return
                    zos.putNextEntry(new java.util.zip.ZipEntry(e))
                    if (!e.directory) zos.write(z.getInputStream(e).bytes)
                    zos.closeEntry()
                }
                zos.putNextEntry(new java.util.zip.ZipEntry('assets/noxclient/sig.txt'))
                zos.write(sig.getBytes('UTF-8'))
                zos.closeEntry()
                // build watermark (Modul 30.4): per-build fingerprint — NOT
                // secret, identifies which build a leaked/cracked jar is from
                def wm = "${System.currentTimeMillis()}-${sig[0..11]}-${project.version}"
                zos.putNextEntry(new java.util.zip.ZipEntry('assets/noxclient/watermark.txt'))
                zos.write(wm.getBytes('UTF-8'))
                zos.closeEntry()
            }
        }
        if (!tmp.renameTo(jarPath)) throw new GradleException("sig rewrite failed")
        println "nox sig -> ${sig} (embedded)"
    }
}
tasks.named('jar') { finalizedBy noxJarSig }

// Native core (Rust JNI, Modul 30.1) — release-stripped, build-salted.
// Runs before processResources so the .so lands inside the jar.
def noxNative = tasks.register('noxNative', Exec) {
    def out = file("${layout.projectDirectory}/native/target/release/libnoxcore.so")
    def dest = file("${layout.projectDirectory}/src/main/resources/natives/linux-amd64/libnoxcore.so")
    outputs.file(out)
    onlyIf { !dest.exists() || dest.lastModified() < file("${layout.projectDirectory}/native/src/lib.rs").lastModified() }
    environment 'NOX_BUILD_SALT', providers.environmentVariable('NOX_BUILD_SALT').orElse('nox-dev')
    workingDir "${layout.projectDirectory}/native"
    commandLine 'cargo', 'build', '--release'
    doLast { dest.bytes = out.bytes }
}
tasks.named('processResources') { dependsOn noxNative }
